<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="robots" content="noindex">
	<title>Page not found – TheDeiw</title>
	<script>
		// Old links: /TheDeiwGames/* moved to thedeiwsgames.github.io, /TheDeiwPortfolio/* moved to the site root.
		(function () {
			var p = location.pathname, rest = location.search + location.hash;
			if (/^\/TheDeiwGames(\/|$)/i.test(p)) location.replace("https://thedeiwsgames.github.io/" + p.replace(/^\/TheDeiwGames\/?/i, "") + rest);
			else if (/^\/TheDeiwPortfolio(\/|$)/i.test(p)) location.replace("/" + p.replace(/^\/TheDeiwPortfolio\/?/i, "") + rest);
		})();
	</script>
	<style>
		body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #121216; color: #eee; font-family: system-ui, sans-serif; text-align: center; }
		a { color: #7aa7ff; }
	</style>
</head>
<body>
	<main>
		<h1>404 – Page not found</h1>
		<p><a href="https://thedeiw.github.io/">TheDeiw – Portfolio</a> · <a href="https://thedeiwsgames.github.io/">TheDeiw's Games</a></p>
	</main>
</body>
</html>
